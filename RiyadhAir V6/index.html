<!DOCTYPE html>
<html lang="en-us">

    <title>Riyadh Air</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0">
    <canvas
      id="unity-canvas"
      width=600
      height=960
      tabindex="-1"
      style="width: 600px; height: 960px; background: #231F20"
    ></canvas>
    <script src="Build/Riyadh Air.loader.js"></script>
    <script>
      var startTime = new Date().getTime();
      var MyGameInstance = null;
      var MaxProgress = -1;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        var mobileCanvas = document.querySelector("#unity-canvas");
        mobileCanvas.style.width = "100%";
        mobileCanvas.style.height = "100%";
        mobileCanvas.style.position = "fixed";
        document.body.style.textAlign = "left";
      }

      InitializeLoadingEvent();

      var canvas = document.querySelector("#unity-canvas");
      var config = {
        arguments: [],
        dataUrl: "Build/Riyadh Air.data.unityweb",
        frameworkUrl: "Build/Riyadh Air.framework.js.unityweb",
        codeUrl: "Build/Riyadh Air.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Riyadh Air",
        productVersion: "1.0",
      };

      createUnityInstance(canvas, config, (progress) => {
        if (progress > MaxProgress) {
          MaxProgress = progress;
          BroadcastGameLoadingEvent(progress);
        }
      })
        .then((unityInstance) => {
          MyGameInstance = unityInstance;
          CalculateLoadTime(startTime);
          console.log("Unity ready — starting Barrq test payload");
          // Comment the next line for full native Barrq integration (host calls doInitiate).
          doStartTest();
          console.log(MyGameInstance);
        })
        .catch((err) => {
          console.error("createUnityInstance failed", err);
        });

      function InitializeLoadingEvent() {
        addEventListener("onGameLoading", (e) => {
          try {
            if (
              window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers.onGameLoading
            ) {
              console.log("IOS Interceptor:: onGameLoading");
              window.webkit.messageHandlers.onGameLoading.postMessage(e.detail);
            } else if (typeof BarraqAndroidBridge !== "undefined") {
              console.log("BarraqAndroidBridge:: onGameLoading");
              BarraqAndroidBridge.onGameLoading(JSON.stringify(e.detail));
            } else {
              console.log("non-native environment:: onGameLoading");
            }
          } catch (err) {
            console.warn("error while trying to run nativley - ", err.message);
            console.log("non-native environment::onGameLoading");
          }
        });
      }

      function BroadcastGameLoadingEvent(progress) {
        console.log(
          "HTML -> Native  onGameLoading Event, Progress = " + progress
        );
        const event = new CustomEvent("onGameLoading", {
          detail: {
            message: "Game Load Percentage: " + progress,
            data: {
              load_progress: progress,
            },
          },
        });
        dispatchEvent(event);
      }

      function CalculateLoadTime(bootTimestamp) {
        var loadedTimestamp = new Date().getTime();
        var difference = loadedTimestamp - bootTimestamp;
        var minutes = parseInt(difference / 1000 / 60);
        var seconds = parseInt((difference / 1000) % 60);
        console.log(
          "Game Loadtime = " + difference + " ms",
          "which is equlivlent to " + minutes + ":" + seconds + " minutes"
        );
      }

      function doInitiate(encodedData) {
        console.log("Calling DoInitiate From Native");
        if (MyGameInstance) {
          MyGameInstance.SendMessage("JS", "DoInitiate", encodedData);
        } else {
          console.warn("doInitiate: MyGameInstance is null");
        }
      }

      function doClose() {
        if (MyGameInstance) {
          MyGameInstance.SendMessage("JS", "DoQuit");
        }
      }

      function doPause() {
        if (MyGameInstance) {
          MyGameInstance.SendMessage("JS", "DoPause");
        }
      }

      function doResume() {
        if (MyGameInstance) {
          MyGameInstance.SendMessage("JS", "DoResume");
        }
      }

      function doConnectionLost() {
        if (MyGameInstance) {
          MyGameInstance.SendMessage("JS", "DoConnectionLost");
        }
      }

      function doConnectionRegained() {
        if (MyGameInstance) {
          MyGameInstance.SendMessage("JS", "DoConnectionRegained");
        }
      }

      function doExitGame() {
        if (MyGameInstance) {
          MyGameInstance.SendMessage("JS", "DoExitGame");
        }
      }

    </script>
