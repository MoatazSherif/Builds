<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Card_Match_Memory</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=600 height=960 tabindex="-1" style="width: 600px; height: 960px; background: #231F20"></canvas>
    <script src="Build/Card_Match_Memory.loader.js"></script>
    <script>
            var unityInstance = null;
      var unityReady = false;

      function handleUnityString(message) {
        console.log("[Card_Match_Memory]", message);
        if (unityInstance) {
          unityInstance.SendMessage("WebGLMessageBridge", "OnReceiveString", String(message));
        }
      }

      function getUnityInteger() {
        return 0;
      }

      function onUnityReady() {
        unityReady = true;
        console.log("[Card_Match_Memory] Unity ready");
        return true;
      }

      function onUnityGameFinished(win, score) {
        var result = (win ? "win" : "lose") + ": " + score;
        console.log("[Card_Match_Memory] Game finished", result);
        return result;
      }

      window.handleUnityString = handleUnityString;
      window.getUnityInteger = getUnityInteger;
      window.onUnityReady = onUnityReady;
      window.onUnityGameFinished = onUnityGameFinished;

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Card_Match_Memory.data",
        frameworkUrl: "Build/Card_Match_Memory.framework.js",
        codeUrl: "Build/Card_Match_Memory.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Card_Match_Memory",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then(function (instance) {
        unityInstance = instance;
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
